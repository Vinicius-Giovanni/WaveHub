<!-- HISTÓRICO -->
<article class="dashboard-panel performance-panel">

    <div class="panel-header">
        <div>
            <h2>Histórico de performance por hora</h2>
            <p>
                Demanda, executado e meta ao longo do dia.
            </p>
        </div>
    </div>

    <div class="chart-placeholder">
        <div class="chart-y-axis">
            <span>4000</span>
            <span>3000</span>
            <span>2000</span>
            <span>1000</span>
            <span>0</span>
        </div>

        <div class="chart-area">

            <div class="chart-grid-line"></div>
            <div class="chart-grid-line"></div>
            <div class="chart-grid-line"></div>
            <div class="chart-grid-line"></div>
            <div class="chart-grid-line"></div>

            <div class="chart-message">
                Gráfico
            </div>

        </div>
    </div>

    <div class="chart-legend">

        <span>
            <i class="legend-demand"></i>
            demanda
        </span>

        <span>
            <i class="legend-executed"></i>
            executado
        </span>

        <span>
            <i class="legend-target"></i>
            meta
        </span>

    </div>

</article>


<!-- PRODUTIVIDADE -->
<article class="dashboard-panel productivity-panel">

    <div class="panel-header">
        <div>
            <h2>Produtividade por equipe</h2>
            <p>Peças por hora (pph).</p>
        </div>
    </div>

    <div class="bar-chart">

        <div class="bar-item">
            <div class="bar" style="height: 90%;"></div>
            <span>1º Turno</span>
        </div>

        <div class="bar-item">
            <div class="bar" style="height: 74%;"></div>
            <span>2º Turno</span>
        </div>

        <div class="bar-item">
            <div class="bar" style="height: 60%;"></div>
            <span>3º Turno</span>
        </div>

        <div class="bar-item">
            <div class="bar" style="height: 48%;"></div>
            <span>ADM</span>
        </div>

    </div>

</article>
