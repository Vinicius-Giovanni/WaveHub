<header class="home-header">
    <button
        class="sidebar-toggle"
        id="sidebarToggle"
        aria-label="Abrir menu"
    >
        <span class="material-symbols-outlined">
            menu
        </span>
    </button>

    <div class="home-header-title">
        <span class="material-symbols-outlined">
            {{ header_icon or 'hub' }}
        </span>

        {{ header_title or 'Central inteligente de operações' }}
    </div>

    <div class="home-user">
        <div>
            <strong>
                {{ header_user_name or 'user' }}
            </strong>

            <span>
                {{ header_user_role or 'Operações' }}
            </span>
        </div>
    </div>
</header>
