<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estoque 3D</title>

    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/css/estoque3d.css">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
        }
    }
    </script>
</head>

<body>

    <main>
        <div id="estoque-3d"></div>

        <div id="crosshair"></div>

        <!-- Busca -->
        <div id="busca-container">
            <input
                type="text"
                id="busca-input"
                placeholder="Buscar: 002-015-03, item:5286255, rua:002..."
                autocomplete="off"
            >
            <ul id="busca-resultados"></ul>
        </div>

        <!-- Filtros -->
        <div id="filtros-container">
            <button class="filtro-btn ativo" data-filtro="todas">Todas</button>
            <button class="filtro-btn" data-filtro="ocupada">Ocupadas</button>
            <button class="filtro-btn" data-filtro="vazia">Vazias</button>

            <select id="filtro-rua">
                <option value="">Rua: todas</option>
            </select>

            <select id="filtro-habilitado">
                <option value="todas">Habilitado: todos</option>
                <option value="sim">Habilitados</option>
                <option value="nao">Não habilitados</option>
            </select>

            <select id="filtro-zona">
                <option value="">Zona: todas</option>
            </select>

            <select id="filtro-tipo-eqp">
                <option value="">Equipamento: todos</option>
            </select>

            <select id="filtro-tipo-local">
                <option value="">Tipo de local: todos</option>
            </select>
        </div>

        <!-- Legenda -->
        <div id="legenda-container">
            <div class="legenda-item"><span class="legenda-cor legenda-ocupada"></span> Ocupada</div>
            <div class="legenda-item"><span class="legenda-cor legenda-vazia"></span> Vazia</div>
            <div class="legenda-item"><span class="legenda-cor legenda-selecionada"></span> Selecionada</div>
        </div>

        <!-- Painel de detalhes da posição -->
        <div id="painel-detalhes" class="oculto">
            <button id="painel-fechar" aria-label="Fechar">×</button>
            <h3 id="painel-titulo"></h3>
            <div id="painel-conteudo"></div>
        </div>

        <!-- Dashboard flutuante -->
        <div id="dashboard-container">
            <div id="dashboard-header">
                <span id="dashboard-titulo">Resumo da visualização</span>
                <button id="dashboard-toggle" aria-expanded="true" aria-label="Ocultar/mostrar dashboard">▾</button>
            </div>

            <div id="dashboard-grid">
                <div class="dash-card">
                    <span class="dash-label">Ruas visíveis</span>
                    <span class="dash-valor" id="db-ruas">0</span>
                </div>
                <div class="dash-card">
                    <span class="dash-label">Posições</span>
                    <span class="dash-valor" id="db-total">0</span>
                </div>
                <div class="dash-card dash-ocupada">
                    <span class="dash-label">Ocupadas</span>
                    <span class="dash-valor" id="db-ocupadas">0</span>
                </div>
                <div class="dash-card dash-vazia">
                    <span class="dash-label">Vazias</span>
                    <span class="dash-valor" id="db-vazias">0</span>
                </div>
                <div class="dash-card">
                    <span class="dash-label">Itens</span>
                    <span class="dash-valor" id="db-itens">0</span>
                </div>
                <div class="dash-card">
                    <span class="dash-label">Zonas</span>
                    <span class="dash-valor" id="db-zonas">0</span>
                </div>
                <div class="dash-card">
                    <span class="dash-label">Níveis</span>
                    <span class="dash-valor" id="db-niveis">0</span>
                </div>
                <div class="dash-card">
                    <span class="dash-label">Locais</span>
                    <span class="dash-valor" id="db-locais">0</span>
                </div>
                <div class="dash-card dash-destaque">
                    <span class="dash-label">Ocupação</span>
                    <span class="dash-valor" id="db-ocupacao">0%</span>
                </div>
                <div class="dash-card">
                    <span class="dash-label">Ruas habilitadas</span>
                    <span class="dash-valor" id="db-habilitadas">0</span>
                </div>
                <div class="dash-card">
                    <span class="dash-label">Ruas não habilitadas</span>
                    <span class="dash-valor" id="db-nao-habilitadas">0</span>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="/static/js/estoque3d.js"></script>

</body>
</html>
